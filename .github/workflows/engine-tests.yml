name: engine-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: si }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/si" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r services/prediction-engine/requirements.txt
      - name: Apply migrations
        run: for f in database/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
      - name: Build forecasts from committed backtest artifacts
        working-directory: services/prediction-engine
        run: python -m app.pipeline.run_all 2026-10-23 && python -m app.pipeline.load_db --reset
      - name: Test
        working-directory: services/prediction-engine
        run: python -m pytest -q
