# UNTESTED scaffold: daily data refresh -> forecasts -> rebuilt dashboard committed back. Wire your host (Netlify/Pages) to deploy from the repo.
name: daily-refresh
on: { schedule: [{ cron: "0 6 * * *" }], workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r services/prediction-engine/requirements.txt
      - run: make refresh
      - run: |
          git config user.name "refresh-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/raw apps/dashboard/index.html artifacts/evaluation.json artifacts/availability.json; git diff --cached --quiet || git commit -m "chore: daily data refresh" && git push
