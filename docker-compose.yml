services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: sports_intelligence, POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}" }
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - sports_pg:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro      # migrations auto-apply on first start
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d sports_intelligence"], interval: 5s, retries: 10 }
  api:
    build: { context: ., dockerfile: services/prediction-engine/Dockerfile }
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./artifacts:/srv/artifacts:ro"]
    environment: { RATE_LIMIT_PER_MIN: "60" }
volumes: { sports_pg: {} }
